<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pappa Kennedy's Electric Works</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07040a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pappa Kennedy">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Pappa Kennedy's Electric Works: a funky neon falling-block wiring puzzle. Complete rows, wire up the funk, light up the night.">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;height:100%;background:#07040a;overflow:hidden;color:#fff;font-family:'Trebuchet MS','Avenir Next',Verdana,Arial,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{position:fixed;inset:0}
:root{--fs:16px;--grv:'Cooper Black','Bookman Old Style','Chalkboard SE','Marker Felt','Arial Rounded MT Bold','Trebuchet MS',sans-serif}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;background:#07040a}
#ui{position:fixed;inset:0;pointer-events:none;z-index:20}
#ui > *{pointer-events:auto}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:min(94vw,560px);max-height:var(--shH,56vh);box-sizing:border-box;background:rgba(10,4,18,.9);border:3px solid #ff2bd6;border-radius:18px;box-shadow:0 0 6px #ff2bd6,0 0 22px rgba(255,43,214,.55),inset 0 0 14px rgba(255,43,214,.35),0 8px 30px #000;padding:12px 16px 10px;font-size:var(--fs);line-height:1.3;display:flex;flex-direction:column;animation:pop .22s ease-out}
.sheet.center{bottom:auto;top:50%;transform:translate(-50%,-50%);max-height:calc(100% - 20px);animation:popc .22s ease-out}
.sheet.cyan{border-color:#29f3ff;box-shadow:0 0 6px #29f3ff,0 0 22px rgba(41,243,255,.5),inset 0 0 14px rgba(41,243,255,.3),0 8px 30px #000}
.sheet.gold{border-color:#ffe23a;box-shadow:0 0 6px #ffe23a,0 0 22px rgba(255,226,58,.5),inset 0 0 14px rgba(255,226,58,.3),0 8px 30px #000}
.sheet.red{border-color:#ff3b5c;box-shadow:0 0 6px #ff3b5c,0 0 22px rgba(255,59,92,.6),inset 0 0 14px rgba(255,59,92,.35),0 8px 30px #000}
.sheet.clear{background:transparent;border:0;box-shadow:none;padding:0}
.sheet .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;min-height:0;flex:1 1 auto}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.92)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes popc{from{opacity:0;transform:translate(-50%,-50%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.sheet h2{margin:0 0 6px;font:900 calc(var(--fs)*1.45)/1.1 var(--grv);color:#fff;text-align:center;letter-spacing:1px;text-shadow:0 0 4px #ff2bd6,0 0 10px #ff2bd6,0 0 22px #ff2bd6}
.sheet.cyan h2{text-shadow:0 0 4px #29f3ff,0 0 10px #29f3ff,0 0 22px #29f3ff}
.sheet.gold h2{text-shadow:0 0 4px #ffb21f,0 0 10px #ffb21f,0 0 22px #ff8a1f}
.sheet.red h2{text-shadow:0 0 4px #ff3b5c,0 0 10px #ff3b5c,0 0 22px #ff3b5c}
.sheet h3{margin:8px 0 3px;font:900 var(--fs) var(--grv);color:#ffe23a;text-shadow:0 0 8px rgba(255,226,58,.7)}
.sheet p{margin:4px 0}
.quote{font-weight:bold;font-style:italic;color:#ffd4f6;text-align:center;margin:4px 0 6px}
.small{font-size:calc(var(--fs)*.78);color:#d9c6ef}
.ctr{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:8px}
button.btn{font:900 calc(var(--fs)*1.0) var(--grv);background:rgba(20,6,34,.85);color:#fff;border:3px solid #29f3ff;border-radius:999px;padding:8px 18px;min-height:48px;min-width:48px;cursor:pointer;letter-spacing:.5px;touch-action:manipulation;text-shadow:0 0 6px #29f3ff;box-shadow:0 0 8px rgba(41,243,255,.6),inset 0 0 8px rgba(41,243,255,.3)}
button.btn:hover,button.btn.sel{background:rgba(41,243,255,.22)}
button.btn:active{transform:scale(.96)}
button.btn.pink{border-color:#ff2bd6;text-shadow:0 0 6px #ff2bd6;box-shadow:0 0 8px rgba(255,43,214,.7),inset 0 0 8px rgba(255,43,214,.35)}
button.btn.pink:hover,button.btn.pink.sel{background:rgba(255,43,214,.25)}
button.btn.gold{border-color:#ffe23a;text-shadow:0 0 6px #ffb21f;box-shadow:0 0 8px rgba(255,226,58,.7),inset 0 0 8px rgba(255,226,58,.35)}
button.btn.gold:hover,button.btn.gold.sel{background:rgba(255,226,58,.22)}
button.btn.big{font-size:calc(var(--fs)*1.3);padding:10px 30px}
button.btn:disabled{opacity:.35}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:calc(var(--fs)*.86)}
.kv b{color:#ffe23a;white-space:nowrap}
.key{display:inline-block;border:2px solid #29f3ff;color:#bff9ff;border-radius:6px;padding:0 5px;margin:1px;font:bold calc(var(--fs)*.74) Verdana,Arial,sans-serif}
.sl{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:calc(var(--fs)*.9)}
.sl span:first-child{min-width:5.5em}
.sl input[type=range]{flex:1;height:36px;accent-color:#ff2bd6;touch-action:none}
.sl .v{min-width:3em;text-align:right;color:#ffe23a}
.tog{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:calc(var(--fs)*.9)}
.tog input{width:24px;height:24px;accent-color:#ff2bd6}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.lv{position:relative;border:2px solid #3a2a50;border-radius:12px;background:rgba(0,0,0,.55);padding:4px 4px 6px;text-align:center;cursor:pointer;color:#fff;font:bold calc(var(--fs)*.72) 'Trebuchet MS',sans-serif;min-height:48px;touch-action:manipulation}
.lv canvas{width:100%;aspect-ratio:1/1;display:block}
.lv.on{border-color:#29f3ff;box-shadow:0 0 8px rgba(41,243,255,.5)}
.lv.lit{border-color:#ffe23a;box-shadow:0 0 10px rgba(255,226,58,.6)}
.lv.locked{opacity:.45;cursor:default}
.lv .n{position:absolute;left:6px;top:4px;color:#ffe23a;font:900 calc(var(--fs)*.85) var(--grv);text-shadow:0 0 6px #ff8a1f}
.lv.sel{outline:3px solid #ff2bd6}
.score{font:900 calc(var(--fs)*1.25) var(--grv);color:#ffe23a;text-align:center;text-shadow:0 0 8px #ff8a1f}
/* ---------- top buttons ---------- */
.topb{position:fixed;z-index:30;width:44px;height:44px;border-radius:12px;border:2px solid #ff2bd6;background:rgba(14,4,24,.75);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;touch-action:none;box-shadow:0 0 8px rgba(255,43,214,.6)}
.topb svg{width:22px;height:22px}
.topb:active{background:rgba(255,43,214,.5)}
.topb.hide{display:none}
/* ---------- touch controls ---------- */
#tc{position:fixed;inset:0;pointer-events:none;z-index:15;display:none}
body.touch #tc.on{display:block}
.tb{position:absolute;pointer-events:auto;touch-action:none;box-sizing:border-box;border-radius:18px;border:3px solid rgba(41,243,255,.95);background:rgba(8,20,30,.55);color:#e9fdff;font:900 11px 'Trebuchet MS',Verdana,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1;box-shadow:0 0 10px rgba(41,243,255,.55),inset 0 0 10px rgba(41,243,255,.25);cursor:pointer;overflow:hidden;letter-spacing:1px}
.tb svg{width:46%;height:46%;max-width:34px;max-height:34px;filter:drop-shadow(0 0 3px currentColor)}
.tb span{margin-top:2px}
.tb.pk{border-color:rgba(255,43,214,.95);color:#ffe0fa;background:rgba(30,6,30,.55);box-shadow:0 0 10px rgba(255,43,214,.55),inset 0 0 10px rgba(255,43,214,.25)}
.tb.yl{border-color:rgba(255,226,58,.95);color:#fff8d0;background:rgba(30,24,4,.55);box-shadow:0 0 10px rgba(255,226,58,.55),inset 0 0 10px rgba(255,226,58,.25)}
.tb.gr{border-color:rgba(70,255,116,.95);color:#e0ffe8;background:rgba(4,30,10,.55);box-shadow:0 0 10px rgba(70,255,116,.55),inset 0 0 10px rgba(70,255,116,.25)}
.tb.dn{transform:scale(.93);background:rgba(41,243,255,.55);color:#001}
.tb.pk.dn{background:rgba(255,43,214,.6)}
.tb.yl.dn{background:rgba(255,226,58,.65)}
.tb.gr.dn{background:rgba(70,255,116,.6)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="tc">
  <div class="tb" data-a="left" aria-label="Left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,4 7,12 15,20"/></svg></div>
  <div class="tb" data-a="right" aria-label="Right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,4 17,12 9,20"/></svg></div>
  <div class="tb gr" data-a="soft" aria-label="Soft drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,8 12,15 19,8"/></svg><span>SOFT</span></div>
  <div class="tb yl" data-a="hard" aria-label="Hard drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,3 12,9 18,3"/><polyline points="6,10 12,16 18,10"/><line x1="4" y1="21" x2="20" y2="21"/></svg><span>DROP</span></div>
  <div class="tb pk" data-a="ccw" aria-label="Rotate left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 9.5A7.5 7.5 0 1 1 5 14"/><polyline points="4,4 5.5,9.5 11,8.5"/></svg></div>
  <div class="tb pk" data-a="cw" aria-label="Rotate right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 9.5A7.5 7.5 0 1 0 19 14"/><polyline points="20,4 18.5,9.5 13,8.5"/></svg></div>
  <div class="tb" data-a="hold" aria-label="Hold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14"/><polyline points="14,4 18,8 14,12"/><path d="M20 16H6"/><polyline points="10,12 6,16 10,20"/></svg><span>HOLD</span></div>
</div>
<button class="topb" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="#fff"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
<button class="topb" id="bMute" aria-label="Mute"></button>
<div id="ui"></div>
<script>
"use strict";
/* ===================== CORE: utils, save, colors, scenes ===================== */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeBack = t => { t = clamp(t, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const approach = (v, t, k) => v + (t - v) * (1 - Math.exp(-k));
const TAU = Math.PI * 2;
const cv = $('#cv');
let g = cv.getContext('2d');
let DPR = 1, VW = 360, VH = 640, T = 0, DT = 0;
let IS_TOUCH = false;
const COARSE = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
const FORCE_TOUCH = /[?&]touch=1/.test(location.search);

/* ---------- save ---------- */
const SAVE_KEY = 'pappa_kennedy_v1';
const S = { musicVol: 0.6, sfxVol: 0.85, mute: false, gestures: true, ghost: true, shake: true, unlocked: 1, hi: 0, hiLines: 0, lit: [], best: {}, plays: 0, won: 0 };
function loadSave() { try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); for (const k in S) if (d[k] !== undefined) S[k] = d[k]; } catch (e) { } S.unlocked = clamp(S.unlocked | 0 || 1, 1, 10); if (!Array.isArray(S.lit)) S.lit = []; }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { } }

/* ---------- colors ---------- */
const _rgb = new Map();
function hexRGB(h) { let c = _rgb.get(h); if (c) return c; let s = h.replace('#', ''); if (s.length === 3) s = s.split('').map(x => x + x).join(''); c = [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)]; _rgb.set(h, c); return c; }
function rgba(h, a) { const c = hexRGB(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
const _sh = new Map();
function shade(hex, k) { // k<0 darker, k>0 lighter (toward white)
  const key = hex + k; let r = _sh.get(key); if (r) return r;
  let [R, G, B] = hexRGB(hex);
  if (k < 0) { R *= 1 + k; G *= 1 + k; B *= 1 + k; } else { R += (255 - R) * k; G += (255 - G) * k; B += (255 - B) * k; }
  const h = v => ('0' + Math.round(clamp(v, 0, 255)).toString(16)).slice(-2); r = '#' + h(R) + h(G) + h(B); _sh.set(key, r); return r;
}
function hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; }
const NEON = { pink: '#ff2bd6', cyan: '#29f3ff', yellow: '#ffe23a', orange: '#ff8a1f', green: '#46ff74', red: '#ff3b5c', blue: '#3f7dff', purple: '#b44bff', white: '#ffffff', gold: '#ffc23a', mint: '#6dffd8' };

/* ---------- scenes + DOM helpers ---------- */
let scene = null;
const UI = $('#ui');
function go(sc, arg) { if (scene && scene.exit) scene.exit(); scene = sc; UI.innerHTML = ''; if (sc.enter) sc.enter(arg); if (typeof TC !== 'undefined' && TC.built) TC.sync(); hitA('scene_' + sc.name); }
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function sheet(html, cls = '') { const s = el(`<div class="sheet ${cls}">${html}</div>`); UI.appendChild(s); bindButtons(s); return s; }
function bindButtons(root) { root.querySelectorAll('button[data-k]').forEach(b => { b.addEventListener('click', e => { e.stopPropagation(); audioInit(); const k = b.dataset.k; SFX.ui(k === 'back' ? 'back' : 'ok'); const h = root._h && root._h[k]; if (h) h(b); }); }); }
function on(root, handlers) { root._h = handlers; return root; }
function menuKey(e) {
  const bs = [...UI.querySelectorAll('button.btn, .lv:not(.locked)')].filter(b => b.offsetParent && !b.disabled); if (!bs.length) return false;
  let i = bs.findIndex(b => b.classList.contains('sel'));
  if (/^(ArrowRight|ArrowDown|Tab)$/.test(e.code)) { i = (i + 1) % bs.length; } else if (/^(ArrowLeft|ArrowUp)$/.test(e.code)) { i = (i - 1 + bs.length) % bs.length; }
  else if (e.code === 'Enter' || e.code === 'Space') { (bs[i] || bs[0]).click(); return true; } else return false;
  bs.forEach(b => b.classList.remove('sel')); bs[i].classList.add('sel'); if (bs[i].scrollIntoView) try { bs[i].scrollIntoView({ block: 'nearest' }); } catch (er) { } SFX.ui('move'); return true;
}
function fmt(n) { return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
/* ===================== AUDIO: 100% procedural WebAudio (no samples) ===================== */
let AC = null, BUS = {}, NZ = null;
const AUD = { counts: {}, log: [], voices: 0, cd: {} };
function aNow() { return AC ? AC.currentTime : 0; }
function hitA(n) { AUD.counts[n] = (AUD.counts[n] || 0) + 1; AUD.log.push(n); if (AUD.log.length > 300) AUD.log.shift(); }
function sfxOK(name, cd) { hitA(name); if (!AC || AC.state === 'closed' || S.mute || S.sfxVol < 0.001) return false; if (cd) { const t = aNow(); if (AUD.cd[name] != null && t - AUD.cd[name] < cd) return false; AUD.cd[name] = t; } return AUD.voices < 64; }
function mkNoise(c) {
  const len = c.sampleRate * 2, mk = () => c.createBuffer(1, len, c.sampleRate), w = mk(), p = mk(), b = mk();
  const W = w.getChannelData(0), Pn = p.getChannelData(0), B = b.getChannelData(0); let b0 = 0, b1 = 0, b2 = 0, br = 0;
  for (let i = 0; i < len; i++) { const x = Math.random() * 2 - 1; W[i] = x; b0 = .99765 * b0 + x * .099046; b1 = .963 * b1 + x * .2965164; b2 = .57 * b2 + x * 1.0526913; Pn[i] = (b0 + b1 + b2 + x * .1848) * .2; br = (br + .02 * x) / 1.02; B[i] = br * 3.5; }
  return { w, p, b };
}
function mkImpulse(c, secs) { const n = Math.floor(c.sampleRate * secs), b = c.createBuffer(2, n, c.sampleRate); for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3) * (i < 60 ? i / 60 : 1); } return b; }
function curve(k) { const n = 1024, c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = (1 + k) * x / (1 + k * Math.abs(x)); } return c; }
function buildGraph() {
  const c = AC, B = {};
  B.master = c.createGain(); B.master.gain.value = S.mute ? 0 : 0.9;
  B.lim = c.createDynamicsCompressor(); B.lim.threshold.value = -9; B.lim.knee.value = 4; B.lim.ratio.value = 10; B.lim.attack.value = 0.003; B.lim.release.value = 0.18;
  B.master.connect(B.lim); B.lim.connect(c.destination);
  B.rev = c.createConvolver(); B.rev.buffer = mkImpulse(c, 1.4); B.revOut = c.createGain(); B.revOut.gain.value = 0.45; B.rev.connect(B.revOut); B.revOut.connect(B.master);
  B.sfx = c.createGain(); B.sfx.gain.value = S.sfxVol; B.sfx.connect(B.master);
  B.sfxRev = c.createGain(); B.sfxRev.gain.value = 0.2; B.sfx.connect(B.sfxRev); B.sfxRev.connect(B.rev);
  B.music = c.createGain(); B.music.gain.value = S.musicVol * 0.6; B.music.connect(B.master);
  B.duck = c.createGain(); B.duck.gain.value = 1; B.duck.connect(B.music);
  B.musRev = c.createGain(); B.musRev.gain.value = 0.1; B.duck.connect(B.musRev); B.musRev.connect(B.rev);
  B.drive = curve(4); B.crunch = curve(30);
  BUS = B; NZ = mkNoise(c);
  Hum.start();
}
function audioInit() {
  if (!AC) { try { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; AC = new C(); buildGraph(); hitA('audioInit'); } catch (e) { AC = null; return; } }
  if (AC.state === 'suspended' || AC.state === 'interrupted') { try { const p = AC.resume(); if (p && p.catch) p.catch(() => { }); } catch (e) { } }
}
function applyVol() { if (!AC) return; const t = AC.currentTime; BUS.master.gain.setTargetAtTime(S.mute ? 0 : 0.9, t, 0.03); BUS.sfx.gain.setTargetAtTime(S.sfxVol, t, 0.03); BUS.music.gain.setTargetAtTime(S.musicVol * 0.6, t, 0.03); }
function toggleMute() { S.mute = !S.mute; save(); applyVol(); syncMuteBtn(); hitA('mute_' + S.mute); }

/* ---- building blocks ---- */
function vEnd(node) { AUD.voices++; node.onended = () => { AUD.voices--; }; }
function env(gn, t, a, peak, d, sus = 0) { const p = gn.gain; p.setValueAtTime(0.0001, t); p.linearRampToValueAtTime(peak, t + a); p.exponentialRampToValueAtTime(Math.max(0.0001, sus || 0.0001), t + a + d); }
function thump(t, f0, f1, dur, gain, out, type = 'sine', drive = false) {
  const o = AC.createOscillator(), gn = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur * 0.8);
  env(gn, t, 0.003, gain, dur); let n = o; if (drive) { const ws = AC.createWaveShaper(); ws.curve = BUS.drive; o.connect(ws); n = ws; }
  n.connect(gn); gn.connect(out || BUS.sfx); o.start(t); o.stop(t + dur + 0.05); vEnd(o);
}
function nz(t, kind, ftype, f, q, dur, gain, out, a = 0.002, f2, crunch = false) {
